name: Update parking data

on:
  schedule:
    # Every 15 minutes (GitHub may delay scheduled runs by a few minutes)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-parking
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scrape parking availability
        run: python scrape.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parking.json data/speech.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update parking data"
            git push
          fi
